<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master | Orange Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #05070a; 
            background-image: radial-gradient(circle at top right, #2d1a0a, #05070a);
        }
        /* White Glass Effect */
        .white-glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .orange-glow:focus { 
            border-color: #f97316; 
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.2); 
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between p-6">

    <main class="flex-grow flex items-center justify-center">
        <section class="white-glass rounded-[2rem] p-8 w-full max-w-md">
            <h1 class="text-3xl font-extrabold text-center mb-8">
                To-Do <span class="text-orange-500">List</span>
            </h1>
            
            <div class="flex gap-2 mb-8">
                <input type="text" id="taskInput" placeholder="Write Your Task..." 
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-5 py-3 outline-none transition-all orange-glow text-white">
                <button id="addBtn" class="bg-orange-500 hover:bg-orange-600 text-white w-12 h-12 flex items-center justify-center rounded-xl font-bold transition-all shadow-lg shadow-orange-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
            </div>

            <ul id="taskList" class="space-y-3"></ul>
        </section>
    </main>

    <footer class="w-full py-8 text-center border-t border-white/5">
        <p class="text-zinc-500 text-xs font-semibold uppercase tracking-[0.3em]">
            &copy; 2026 Developed by <span class="text-orange-500">Shafqat Dev</span>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

    <script src="script.js"></script>
    
</body>
</html>
